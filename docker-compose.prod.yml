# Valor on a server: docker compose -f docker-compose.prod.yml ...  (run by deploy/deploy.sh)
#
# Fully separate from any other project on the same host:
#   own project name (valor), own database container and volume, own internal network.
# The only shared thing is the external network "edge": the HTTPS proxy (Caddy) reaches
# valor-web there. Nothing else is attached to it, the database never is.
#
# Moving to another server: copy /opt/valor (with .env) + a database dump, run deploy.sh,
# point the proxy at the new host. See README.md.
name: valor

services:
  valor-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Almaty
    volumes:
      - valor_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  valor-web:
    build: .
    image: valor-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: valor-db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      TZ: Asia/Almaty
    networks:
      internal: {}
      edge:
        aliases: [valor-web]
    depends_on:
      valor-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': 'centrum.kz', 'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 3

networks:
  internal: {}
  edge:
    external: true
    name: edge

volumes:
  valor_pgdata:
